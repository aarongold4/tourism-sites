name: build-and-deploy
# Push to main -> build + audit only the sites that changed (all sites if shared code changed)
# -> publish each site's dist to its own deploy-<domain> branch, which Hostinger pulls into public_html.
# New sites are picked up automatically: any folder sites/<domain>/ with a site.json.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sites:
        description: "Space-separated domains to rebuild (blank = all)"
        required: false
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.pick.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT: ${{ github.event.inputs.sites }}
        run: |
          all=$(ls -d sites/*/ | xargs -n1 basename | while read d; do [ -f "sites/$d/site.json" ] && echo "$d"; done)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            list="${INPUT:-$all}"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            list="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if echo "$changed" | grep -qE '^(tools/|package\.json|\.github/)'; then list="$all"
            else list=$(echo "$changed" | grep -oE '^sites/[^/]+' | cut -d/ -f2 | sort -u | while read d; do [ -f "sites/$d/site.json" ] && echo "$d"; done); fi
          fi
          json=$(printf '%s\n' $list | grep -v '^$' | jq -R . | jq -sc .)
          echo "sites=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $json"
  site:
    needs: plan
    if: needs.plan.outputs.sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        domain: ${{ fromJson(needs.plan.outputs.sites) }}
    concurrency:
      group: deploy-${{ matrix.domain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: node tools/build.mjs ${{ matrix.domain }}
      - name: Audit (blocks deploy on any failure)
        run: node tools/audit.mjs ${{ matrix.domain }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "report-${{ matrix.domain }}", path: "reports/" }
      - name: Publish to deploy-${{ matrix.domain }}
        env:
          D: ${{ matrix.domain }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "dist/$D"
          git init -q -b "deploy-$D"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $D from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:deploy-$D"
